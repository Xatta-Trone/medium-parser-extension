<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Medium Parser</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        min-width: 240px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        background: #fff;
        color: #242424;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      #services {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .service {
        display: block;
        padding: 12px 16px;
        border: 0;
        border-radius: 4px;
        background: #242424;
        color: #fff;
        font: inherit;
        text-align: center;
        cursor: pointer;
      }
      .service:hover,
      .service:focus-visible {
        background: #000;
      }
      #message {
        margin: 0 0 10px;
        color: #555;
      }
      #settings {
        display: block;
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        border: 1px solid #242424;
        border-radius: 4px;
        background: transparent;
        color: #242424;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Medium Parser</h1>
    <p id="message" hidden></p>
    <div id="services"></div>
    <button type="button" id="settings">Settings</button>
    <script src="common.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
