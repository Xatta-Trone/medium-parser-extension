name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Run tests
        run: node --test tests/

      # firefox/ has only its manifest; the add-on is built from chrome/.
      # The tests also check that both manifests have the same version.
      - name: Build Firefox add-on
        run: node scripts/build-firefox.mjs

      - name: Lint Firefox build
        run: npx --yes web-ext@10.8.0 lint --source-dir build/firefox
